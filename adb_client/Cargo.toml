[package]
authors.workspace = true
description = "Rust ADB (Android Debug Bridge) client library"
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "adb_client"
repository.workspace = true
version.workspace = true

[dependencies]
# base64 = { version = "0.22.1" }
bincode = { version = "1.3.3" }
byteorder = { version = "1.5.0" }
# chrono = { version = "0.4.39" }
# homedir = { version = "0.3.4" }
# image = { version = "0.25.5" }
# lazy_static = { version = "1.5.0" }
log = { version = "0.4.22" }
mdns-sd = { version = "0.13.1", default-features = false }
# num-bigint = { version = "0.8.4", package = "num-bigint-dig" }
# num-traits = { version = "0.2.19" }
quick-protobuf = { version = "0.8.1" }
rand = { version = "0.9.0", default-features = false, features = [
    "thread_rng",
] }
rcgen = { version = "0.13.1" }
regex = { version = "1.11.1", features = ["std", "unicode"] }
# rsa = { version = "0.9.7" }
# rusb = { version = "0.9.4", features = ["vendored"] }
rustls = { version = "0.23.18", default-features = false, features = ["std"] }
rustls-pki-types = "1.10.0"
serde = { version = "1.0.216", features = ["derive"] }
serde_repr = { version = "0.1.19" }
# sha1 = { version = "0.10.6", features = ["oid"] }
thiserror = { version = "2.0.7" }
